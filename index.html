<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#F4F2ED" />
  <meta name="description" content="北科圖書館智慧座位展示系統：2.5D即時座位、空間探索、異常與預約管理。" />
  <title>北科圖書館 · 智慧座位系統</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {"imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
    }}
  </script>
  <script src="./config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="brand" data-action="view" data-view="explore">北科圖書館</button>
      <nav id="main-nav" class="main-nav" aria-label="主導覽列">
        <button data-action="view" data-view="explore" class="nav-tab active">空間探索</button>
        <button data-action="view" data-view="records" class="nav-tab">我的預約與追蹤<span id="booking-badge"></span></button>
        <button data-action="view" data-view="librarian" class="nav-tab">館員監控台<span id="report-badge"></span></button>
      </nav>
      <div class="header-actions">
        <span id="mode-indicator" class="mode-indicator">本機模擬</span>
        <button class="btn dark sm" data-action="open-scenario">⚙ 情境模擬</button>
        <button class="btn ghost sm" id="auth-button" data-action="open-auth" title="登入／登出">帳號</button>
      </div>
    </header>
    <main id="main">
      <section id="explore-view" class="explore-view">
        <div class="scene-shell">
          <div id="scene-mount" class="scene-mount" aria-label="互動式2.5D座位場景"></div>
          <div id="seat-pins" class="pin-layer" aria-label="座位標記"></div>
          <div id="scene-fallback" class="scene-fallback" hidden></div>
          <div class="scene-heading">
            <div id="space-switcher" class="space-switcher"></div>
            <div id="space-meta" class="space-meta"></div>
          </div>
          <div class="view-controls">
            <div id="layer-controls" class="segmented"></div>
            <div id="camera-controls" class="segmented"></div>
          </div>
          <div class="scene-help"><span class="legend-dot free"></span>可預約 <span class="legend-dot occupied"></span>到席 <span class="legend-dot away"></span>暫離 <span class="legend-dot anomaly"></span>異常 <span class="help-sep">·</span> 拖曳旋轉／滾輪縮放／點選座位</div>
          <div id="control-dock" class="dock"></div>
          <aside id="seat-drawer" class="drawer" hidden></aside>
        </div>
      </section>
      <section id="records-view" class="page-view" hidden></section>
      <section id="librarian-view" class="page-view" hidden></section>
    </main>
    <div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
    <div id="modal-backdrop" class="modal-backdrop" hidden></div>
  </div>
</body>
</html>
